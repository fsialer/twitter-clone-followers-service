server:
  port: 8084
spring:
  application:
    name: twitter-clone-followers-service
  jackson:
    default-property-inclusion: NON_NULL
  data:
    mongodb:
      uri: ${DB_URL:mongodb://localhost:27017/tc_followers_db}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:1234}
users-service:
  url: ${USER_URL:http://localhost:8080/users}